<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сонечка любимая ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px 50px;
        }
        h1 {
            color: #ff758c;
            margin-bottom: 8px;
            text-align: center;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.4);
        }
        p.subtitle {
            color: #b0b0d0;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 450px;
            width: 100%;
        }
        .day-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .day-card span {
            font-size: 0.65rem;
            font-weight: normal;
            opacity: 0.7;
            margin-top: 2px;
        }
        .day-card:active {
            transform: scale(0.95);
        }
        .day-card.opened {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1e1b3a;
            border: 1px solid #ff758c;
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 430px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            text-align: center;
        }
        .modal-title {
            font-size: 1.3rem;
            color: #ff758c;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-text {
            font-size: 1rem;
            line-height: 1.65;
            color: #e2e2f0;
            margin-bottom: 22px;
            text-align: left;
            white-space: pre-line;
        }
        .btn-close {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            padding: 10px 25px;
            color: #fff;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <script>
    const texts = {1: [

        ],

        ],

        ],
        27: [

            "С тобой по-настоящему интересно.",
            "Я очень рад, что выбрал именно тебя."
        ],
        28: [
            "Если тебе когда-нибудь станет тяжело, грустно или просто захочется с кем-то поговорить — я никуда не денусь.",
            "Ты можешь на меня рассчитывать.",
            "Люблю тебя, Сонечка."
        ],
        29: [
            "Каждый день ловлю себя на мысли, как здорово, что мы однажды начали так плотно общаться.",
            "Ты стала одним из самых тёплых событий в моей жизни за последнее время.",
            "Спасибо тебе."
        ],
        30: [

            "Карточки подошли к концу, но всё самое живое у нас с тобой ещё впереди.",
            "Спасибо тебе за каждый день рядом, за эмоции и за тепло. Я тебя очень сильно люблю. ❤️"
        ]
    };let opened = [];
    try {
        opened = JSON.parse(localStorage.getItem("sonya_days")) || [];
    } catch (e) {
        opened = [];
    }

    const cards = document.querySelectorAll(".day-card");
    for (let i = 0; i < opened.length; i++) {
        const idx = opened[i] - 1;
        if (cards[idx]) {
            cards[idx].classList.add("opened");
        }
    }

    function openDay(num) {
        const modal = document.getElementById("modal");
        const titleEl = document.getElementById("mTitle");
        const textEl = document.getElementById("mText");
        if (!modal  !titleEl  !textEl) return;

        titleEl.textContent = "День " + num + " 💌";
        const paragraphs = texts[num];
        textEl.textContent = Array.isArray(paragraphs) ? paragraphs.join("\n\n") : "";
        modal.classList.add("active");

        if (opened.indexOf(num) === -1) {
            opened.push(num);
            try {
                localStorage.setItem("sonya_days", JSON.stringify(opened));
            } catch (e) {}
            if (cards[num - 1]) {
                cards[num - 1].classList.add("opened");
            }
        }
    }

    function closeModal() {
        const modal = document.getElementById("modal");
        if (modal) {
            modal.classList.remove("active");
        }
    }

</html>
