<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Сонечки ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        h1 {
            color: #ff758c;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        p.subtitle {
            color: #a0a0c0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            user-select: none;
        }

        .day-card:hover {
            transform: translateY(-3px);
            border-color: #ff758c;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
        }

        .day-card.opened {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border-color: transparent;
            color: white;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
        }

        /* Модальное окно с посланием */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: rgba(30, 27, 60, 0.95);
            border: 1px solid rgba(255, 117, 140, 0.4);
            border-radius: 24px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: popup 0.3s ease-out forwards;
        }

        @keyframes popup {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.4rem;
            color: #ff758c;
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .btn-close {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            padding: 12px 30px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s;
        }

        .btn-close:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="calendar-grid" id="grid"></div>

    <!-- Окно для просмотра текста -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">День 1</div>
            <div class="modal-text" id="modalText">Текст послания...</div>
            <button class="btn-close" onclick="closeModal()">Закрыть ❤️</button>
        </div>
    </div>

    <script>
        // Список записок на 30 дней (можешь менять тексты на свои!)
        const messages = [
            "День 1: Спасибо за то, что ты появляешься в моем дне. С тобой всё вокруг становится теплее.",
            "День 2: Твоя улыбка и голос — это то, что мгновенно поднимает мне настроение.",
            "День 3: Даже на расстоянии в тысячи километров я чувствую тебя очень близко.",
            "День 4: Помни: ты под моей защитой, всегда и несмотря ни на что.",
            "День 5: Наша ночная болтовня — моё самое любимое время за весь день.",
            "День 6: Ты уникальная, милая и невероятно красивая. Не забывай об этом!",
            "День 7: Кажется, мы идеальная команда — хоть в играх, хоть в жизни.",
            "День 8: Забирай свой ежедневный обнимательный заряд. Я рядом!",
            "День 9: Твой юмор и твои приколы — это отдельный кайф.",
            "День 10: Спасибо за твоё доверие. Для меня это очень ценно.",
            "День 11: Улыбнись прямо сейчас! Тебе очень идёт улыбка 😊",
            "День 12: Осторожно: этот карточка заряжена на победу во всех делах сегодня!",
            "День 13: Ты — лучшее, что случилось со мной за последнее время.",
            "День 14: Жду не дождусь, когда мы сможем сыграть во что-нибудь снова.",
            "День 15: Ты делаешь меня лучше просто тем, что ты есть.",
            "День 16: Всегда помни, что ты можешь мне доверить абсолютно всё.",
            "День 17: Прошел уже 17-й день, а ты всё так же очаровательна!",
            "День 18: Даже в самые пасмурные дни ты — моё личное сонечко.",
            "День 19: Отправляю тебе миллион виртуальных поцелуев 💋",
            "День 20: Ты невероятно сильная и классная девушка. Горжусь тобой!",
            "День 21: Каждая минута общения с тобой имеет значение.",
            "День 22: Просто напоминание: ты самая лучшая!",
            "День 23: Надеюсь, твой день сегодня проходит легко и спокойно.",
            "День 24: С тобой приятно даже просто молчать.",
            "День 25: Ты очень важный для меня человек.",
            "День 26: Если тебе станет грустно — просто перечитай эти карточки.",
            "День 27: Скоро дойдём до 30 дней, но мои тёплые слова к тебе не закончатся никогда.",
            "День 28: Спасибо за твою поддержку и искренность.",
            "День 29: Ты настоящая и крутая. Обожаю тебя за это.",
            "День 30: Финальный день этого календаря, но лишь начало нашей с тобой истории ❤️"
        ];

        // Загружаем сохраненный прогресс из памяти браузера
        let openedDays = JSON.parse(localStorage.getItem('sonya_opened_days')) || [];

        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');

        // Отрисовка 30 карточек
        messages.forEach((msg, index) => {
            const dayNum = index + 1;
            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerText = dayNum;

            if (openedDays.includes(dayNum)) {
                card.classList.add('opened');
            }

            card.onclick = () => openDay(dayNum, msg, card);
            grid.appendChild(card);
        });

        function openDay(dayNum, text, cardElement) {
            modalTitle.innerText = День ${dayNum} 💌;
            modalText.innerText = text;
            modal.style.display = 'flex';// Сохраняем день как открытый
            if (!openedDays.includes(dayNum)) {
                openedDays.push(dayNum);
                localStorage.setItem('sonya_opened_days', JSON.stringify(openedDays));
                cardElement.classList.add('opened');
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Закрытие при клике мимо окна
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
    <h1>Для Сонечки ✨</h1>
    <p class="subtitle">Открывай по одной карточке каждый день ❤️</p>
