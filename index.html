<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сонечка любимая ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:25px 15px 50px;position:relative;overflow-x:hidden}
.bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart-item{position:absolute;bottom:-40px;color:#ff758c;opacity:0.22;user-select:none;animation:floatUp linear infinite}
.dot-item{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,154,184,0.55),rgba(255,117,140,0));pointer-events:none;animation:floatDot linear infinite}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) rotate(-8deg);opacity:0}
  15%{opacity:0.25}
  85%{opacity:0.22}
  100%{transform:translateY(-110vh) translateX(18px) rotate(12deg);opacity:0}
}
@keyframes floatDot{
  0%{transform:translateY(0) scale(0.8);opacity:0}
  20%{opacity:0.35}
  80%{opacity:0.25}
  100%{transform:translateY(-108vh) scale(1.15);opacity:0}
}
h1,.sub,.grid,.modal{position:relative;z-index:1}
h1{color:#ff758c;margin-bottom:8px;text-align:center;font-size:1.8rem}
.sub{color:#b0b0d0;margin-bottom:24px;text-align:center;font-size:0.95rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:450px;width:100%}
.card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:1.2rem;font-weight:bold;cursor:pointer;user-select:none;backdrop-filter:blur(4px);transition:transform 0.15s ease}
.card:active{transform:scale(0.95)}
.card span{font-size:0.65rem;opacity:0.7;margin-top:2px}
.card.opened{background:linear-gradient(135deg,#ff758c,#ff7eb3);border-color:transparent}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;padding:20px;z-index:99}
.modal.open{display:flex}
.box{background:#1e1b3a;border:1px solid #ff758c;border-radius:20px;padding:24px 20px;max-width:430px;width:100%;max-height:82vh;overflow-y:auto;text-align:center}
.title{color:#ff758c;font-size:1.3rem;font-weight:bold;margin-bottom:14px}
.text{color:#e2e2f0;font-size:1rem;line-height:1.65;text-align:left;margin-bottom:20px;white-space:pre-line}
.btn{background:linear-gradient(45deg,#ff758c,#ff7eb3);border:none;padding:10px 26px;color:#fff;font-weight:bold;border-radius:50px;cursor:pointer}
</style>
</head>
<body>
<div class="bg-decor" id="bgDecor"></div>
<h1>Сонечка любимая ❤️</h1>
<p class="sub">Новая карточка раз в 24 часа</p>
<div class="grid" id="grid"></div>
<div class="modal" id="modal">
  <div class="box">
    <div class="title" id="mTitle"></div>
    <div class="text" id="mText"></div>
    <button class="btn" id="closeBtn">Закрыть ❤️</button>
  </div>
</div>
<script>
const days=["Честно, мне просто правда хорошо с тобой. Между нами разные страны, мы ещё не так много друг о друге знаем, но ты уже успела стать человеком, к которому тянет и о котором постоянно думаешь. Люблю тебя, Сонечка.",
"Удивительно, как быстро рядом с тобой пропадает всякая напряжность. С другими людьми иногда приходится подбирать слова или делать вид, что всё ок, а с тобой получается просто быть собой. Спасибо тебе за эту лёгкость и за то, что ты настоящая.",
"Мне до безумия нравится, как мы можем зацепиться за какую-то мелочь или глупую шутку и улететь в разговоры до ночи. Даже через экран от тебя идёт какое-то своё особенное тепло, которого ни у кого другого нет. Я очень рад, что ты у меня есть.",
"Ты реально очень красивая, живая и притягательная девушка. Иногда ты наверняка сама этого не замечаешь или начинаешь загоняться из-за мелочей, но со стороны ты выглядишь потрясающе. Просто помни, что я всегда на твоей стороне.",
"То, что мы далеко друг другу, иногда бесит — хотелось бы просто взять и оказаться рядом. Но даже на расстоянии ты ощущаешься близкой. Мне с тобой очень хорошо, и я хочу, чтобы это не заканчивалось.",
"Хочу, чтобы у тебя сегодня всё складывалось спокойно и без лишней дёрганности. Пусть рядом будет поменьше тех, кто портит настроение, и побольше моментов, от которых хочется улыбаться. Я тебя очень люблю.",
"Прошла первая неделя, а мне всё так же интересно с тобой разговаривать, шутить и просто быть на связи. В тебе есть какой-то свой огонь и характер, который цепляет с первых секунд. Ты суперская, честно.",
"С тобой даже просто сидеть в звонке или залипать в игры — уже кайф. Не нужно придумывать ничего сверхъестественного, когда человек твой. Рядом с тобой время будто идёт иначе.",
"Спасибо тебе за то, что умеешь слышать и говорить нормально, когда что-то волнует. Это редкое качество, и я в тебе его очень ценю. Мне спокойно рядом с тобой.",
"Я ловлю себя на том, что каждый раз, когда вижу от тебя сообщение или уведомление, внутри становится теплее. Ты умеешь вытащить из любого хренового настроения. Спасибо тебе за это, моя хорошая.",
"Не забывай нормально отдыхать и не загонять себя, даже если мы опять засиделись допоздна. Мне важно, чтобы ты чувствовала себя хорошо и не выматывалась в ноль. Береги себя, пожалуйста.",
"Мне нравится, какая ты разная: то мягкая и тёплая, то острая и с характером. С тобой никогда не бывает скучно или пресно. В тебе есть всё, что заставляет смотреть и слушать с интересом.",
"Пусть сегодня у тебя будет хотя бы один момент, от которого сама собой появится улыбка. Ты её заслуживаешь. Люблю, когда тебе хорошо.",
"Забавно, что мы ещё не встречались вживую, но связь между нами уже такая сильная. Очень хочу, чтобы однажды у нас всё-таки получилось увидеться и пожить этот момент по-напостоящему. Было бы круто.",
"Половина месяца уже позади, а я всё так же рад каждому дню, когда мы на связи. Спасибо тебе за твои слова, эмоции и за то, что ты вообще появилась в моей жизни. Ты мне очень дорога.",
"Если кто-то или что-то сегодня попытается вывести тебя из себя — не трать на это свои нервы. Ты слишком крутая, чтобы распыляться на всякую чушь. Я рядом, если захочешь выговориться.",
"Иногда мне хватает пары твоих слов, чтобы в голове всё встало на свои места. Ты умеешь давать какое-то тихое, но очень сильное спокойствие. Спасибо тебе за это.",
"Без лишнего пафоса и красивых сказок: ты мне правда очень дорога. Мне важно то, что между нами есть, и я дорожу тобой по-настоящему. Люблю тебя.",
"Иногда представляю, как мы сидим где-нибудь в тишине, пьём что-то вкусное и просто болтаем обо всём без спешки. Без экранов и расстояния. Верю, что однажды так и будет.",
"Ты сильная, умная и очень красивая девушка. Не давай никаким сомнениям сбивать тебя с толку. Я вижу тебя настоящей, и ты мне безумно нравишься.","Три недели прошло, а ощущение такое, будто мы уже успели прожить целый отдельный мир. Мне нравится, как мы понимаем друг друга и остаёмся на одной волне. Дальше — только больше.",
"Даже если ты сегодня сонная, уставшая или вообще не в духе — для меня ты всё равно остаёшься той же самой Сонечкой. Не нужно всегда быть идеальной, чтобы быть любимой. Я тебя люблю любой.",
"Желаю тебе сегодня тихого, тёплого вечера без лишней суеты и тяжести в голове. Просто выдохни и отдохни. Обнимаю мысленно.",
"Мне нравится, как у нас рождаются свои шутки и приколы, понятные только нам двоим. Из таких мелочей и складывается что-то по-настоящему своё. Наш вайб — это отдельный кайф.",
"Эти карточки скоро закончатся, но моё отношение к тебе от этого никуда не денется. Это только кусочек нашей истории. Мне очень хочется, чтобы мы шли дальше.",
"Спасибо тебе за то, что ты есть в моих днях. Даже когда мы просто заняты своими делами, зная, что ты где-то рядом на связи, уже становится спокойнее. Ценю тебя.",
"Спасибо за твою искренность, за эмоции и за то, что ты не боишься быть живой. С тобой по-настоящему интересно. Я очень рад, что выбрал именно тебя.",
"Если тебе когда-нибудь станет тяжело, грустно или просто захочется с кем-то поговорить — я никуда не денусь. Ты можешь на меня рассчитывать. Люблю тебя, Сонечка.",
"Каждый день ловлю себя на мысли, как здорово, что мы однажды начали так плотно общаться. Ты стала одним из самых тёплых событий в моей жизни за последнее время. Спасибо тебе.",
"Вот и тридцатый день. Карточки подошли к концу, но всё самое живое у нас с тобой ещё впереди. Спасибо тебе за каждый день рядом, за эмоции и за тепло. Я тебя очень сильно люблю. ❤️"
];

const bgDecor = document.getElementById("bgDecor");
const heartChars = ["♥", "♡", "❤"];
for (let i = 0; i < 14; i++) {
  const h = document.createElement("div");
  h.className = "heart-item";
  h.textContent = heartChars[i % heartChars.length];
  h.style.left = ((i * 7.3) % 95) + "%";
  h.style.fontSize = (14 + (i % 4) * 5) + "px";
  h.style.animationDuration = (11 + (i % 6) * 2.5) + "s";
  h.style.animationDelay = (-((i * 2.1) % 12)) + "s";
  bgDecor.appendChild(h);
}
for (let j = 0; j < 10; j++) {
  const d = document.createElement("div");
  d.className = "dot-item";
  const size = 12 + (j % 3) * 8;
  d.style.width = size + "px";
  d.style.height = size + "px";
  d.style.left = ((j * 9.7 + 4) % 94) + "%";
  d.style.animationDuration = (13 + (j % 5) * 3) + "s";
  d.style.animationDelay = (-((j * 1.8) % 10)) + "s";
  bgDecor.appendChild(d);
}

const DAY_MS = 24 * 60 * 60 * 1000;
let state = { opened: [], lastOpen: 0 };
try {
  const saved = JSON.parse(localStorage.getItem("sonya_days_v2"));
  if (saved && Array.isArray(saved.opened)) {
    state.opened = saved.opened;
    state.lastOpen = Number(saved.lastOpen) || 0;
  }
} catch (e) {}

function saveState() {
  try {
    localStorage.setItem("sonya_days_v2", JSON.stringify(state));
  } catch (e) {}
}

function pad2(n) {
  return n < 10 ? "0" + n : "" + n;
}

function formatDetailedLeft(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return h + " ч " + pad2(m) + " мин " + pad2(s) + " сек";
}

let timerId = null;
function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
}

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const mTitle = document.getElementById("mTitle");
const mText = document.getElementById("mText");

days.forEach((msg, i) => {
  const day = i + 1;
  const el = document.createElement("div");
  el.className = "card" + (state.opened.includes(day) ? " opened" : "");
  el.innerHTML = day + "<span>день</span>";
  el.addEventListener("click", () => {
    stopTimer();
    const alreadyOpened = state.opened.includes(day);
    const now = Date.now();
    const diff = now - state.lastOpen;if (!alreadyOpened && state.lastOpen > 0 && diff < DAY_MS) {
      mTitle.textContent = "Рано пока ⏳";
      const updateCountdown = () => {
        const left = DAY_MS - (Date.now() - state.lastOpen);
        if (left <= 0) {
          stopTimer();
          mText.textContent = "Время вышло! Можешь открыть следующую карточку.";
          return;
        }
        mText.textContent = "До следующей карточки осталось:\n" + formatDetailedLeft(left);
      };
      updateCountdown();
      timerId = setInterval(updateCountdown, 1000);
      modal.classList.add("open");
      return;
    }

    mTitle.textContent = "День " + day + " 💌";
    mText.textContent = msg;
    modal.classList.add("open");

    if (!alreadyOpened) {
      state.opened.push(day);
      state.lastOpen = now;
      saveState();
      el.classList.add("opened");
    }
  });
  grid.appendChild(el);
});

document.getElementById("closeBtn").addEventListener("click", () => {
  stopTimer();
  modal.classList.remove("open");
});
</script>
</body>
</html>
